# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
# WeCom is optional too: uncomment to enable its Source, then set the intelligent robot's ID and secret on the WeCom Source.
# - id: dsh-superagent-wecom
#   disabled: false
# GitLab is optional too: uncomment to enable its Source, then set the glab wrapper and projects on the GitLab Source.
# - id: dsh-superagent-gitlab
#   disabled: false
# PingCode is optional too: uncomment to enable its Source, then set the skill directory and projects on the PingCode Source.
# - id: dsh-superagent-pingcode
#   disabled: false
